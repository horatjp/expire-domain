<title>笑顔崩壊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Creepster&display=swap">
<style>
  :root {
    --bg: #07040a;
    --ink: #e9e2d6;
    --ink-dim: #9a9089;
    --blood: #9c1414;
    --blood-deep: #4a0509;
    --pink: #ffd0da;
    --fear: 0;
    --font-jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-scare: "Creepster", "Shippori Mincho B1", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-jp);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    gap: 8px;
  }
  .hud {
    display: grid;
    gap: 6px;
    max-width: 560px;
    width: 100%;
    margin-inline: auto;
  }
  .hud-title {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: calc(0.18em + var(--fear) * 0.25em);
    text-align: center;
    text-shadow: 0 0 calc(var(--fear) * 22px) rgba(190, 10, 10, calc(var(--fear) * 1.2));
    transition: letter-spacing 0.6s ease;
  }
  .meter {
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: #ffd166;
    transition: width 0.25s ease, background-color 0.4s ease;
  }
  .meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-dim);
    letter-spacing: 0.12em;
    font-variant-numeric: tabular-nums;
  }
  .stage {
    position: relative;
    min-height: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    border-radius: 18px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
    touch-action: none;
    cursor: pointer;
  }
  .msg {
    position: absolute;
    left: 0; right: 0; bottom: 14px;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    pointer-events: none;
    padding-inline: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 calc(var(--fear) * 14px) rgba(200, 0, 0, var(--fear));
    text-wrap: balance;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    max-width: 560px;
    width: 100%;
    margin-inline: auto;
    flex-wrap: wrap;
  }
  .count {
    font-size: 0.9rem;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }
  .count b {
    color: var(--ink);
    font-size: 1.3rem;
    font-family: var(--font-scare);
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-inline: 0.15em;
  }
  .btns { display: flex; gap: 8px; }
  button {
    font: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(233, 226, 214, 0.35);
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.1); }
  button:focus-visible { outline: 2px solid #ffd166; outline-offset: 2px; }
  button.flee { border-color: rgba(190, 40, 40, 0.7); color: #f0b3b3; }
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(3, 1, 2, 0.94);
    padding: 16px;
    z-index: 10;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    display: grid;
    gap: 14px;
    padding: 28px 22px;
    border: 1px solid rgba(233, 226, 214, 0.18);
    border-radius: 14px;
    background: #0d070c;
  }
  .card h2 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2em;
    font-weight: 800;
  }
  .card .big {
    font-family: var(--font-scare);
    font-size: 4rem;
    line-height: 1;
    color: #d9c78a;
  }
  .card .rank {
    font-size: 1.1rem;
    color: var(--ink);
    letter-spacing: 0.15em;
  }
  .card .rank em { font-style: normal; color: #e0483f; }
  .card p { margin: 0; color: var(--ink-dim); font-size: 0.9rem; line-height: 1.7; }
  .card button { justify-self: center; padding: 10px 26px; font-size: 1rem; }
  #flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: #fff;
    opacity: 0;
    z-index: 5;
  }
  @media (prefers-reduced-motion: reduce) {
    .meter-fill, .hud-title { transition: none; }
  }
</style>

<div id="app">
  <header class="hud">
    <div class="hud-title" id="title">笑顔崩壊</div>
    <div class="meter" role="progressbar" aria-label="恐怖度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter">
      <div class="meter-fill" id="meterFill"></div>
    </div>
    <div class="meter-label"><span>恐怖度</span><span id="meterPct">0%</span></div>
  </header>

  <main class="stage">
    <canvas id="c" aria-label="顔。タップすると変化します"></canvas>
    <div class="msg" id="msg">かわいい笑顔。顔をタップしてみて</div>
  </main>

  <footer class="controls">
    <div class="count">タップ <b id="count">0</b> 回</div>
    <div class="btns">
      <button id="soundBtn" type="button" aria-pressed="true">音 ON</button>
      <button id="fleeBtn" type="button" class="flee" hidden>逃げる</button>
    </div>
  </footer>
</div>

<div id="flash"></div>

<div id="overlay" class="overlay" hidden>
  <div class="card">
    <h2 id="resTitle">逃げた</h2>
    <div class="big" id="resCount">0</div>
    <div class="rank">称号：<em id="resRank">臆病者</em></div>
    <p id="resNote"></p>
    <button id="restartBtn" type="button">もう一度</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MAX = 40;
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var off = document.createElement('canvas');
  var octx = off.getContext('2d');
  var app = document.getElementById('app');
  var msgEl = document.getElementById('msg');
  var countEl = document.getElementById('count');
  var meterEl = document.getElementById('meter');
  var meterFill = document.getElementById('meterFill');
  var meterPct = document.getElementById('meterPct');
  var soundBtn = document.getElementById('soundBtn');
  var fleeBtn = document.getElementById('fleeBtn');
  var overlay = document.getElementById('overlay');
  var flashEl = document.getElementById('flash');
  var restartBtn = document.getElementById('restartBtn');

  var W = 0, H = 0, DPR = 1;
  function resize() {
    var r = canvas.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    off.width = canvas.width; off.height = canvas.height;
  }
  if (window.ResizeObserver) { new ResizeObserver(resize).observe(canvas); }
  window.addEventListener('resize', resize);
  resize();

  // ---------- state ----------
  var state = {
    level: 0,
    sound: true,
    phase: 'play',       // play | blackout | lunge | result
    phaseStart: 0,
    pointer: { x: 0, y: 0, has: false },
    pulse: 0,
    blink: 0,
    nextBlink: 2.5,
    glitchUntil: 0,
    nextGlitch: 0,
    flashUntil: 0,
    flashKind: 'white',
    nextFlash: 0,
    twitchOffset: { x: 0, y: 0 },
    twitchUntil: 0,
    dartUntil: 0,
    dart: { x: 0, y: 0 },
    face: { cx: 0, cy: 0, R: 1 },
    lastTime: 0
  };

  function clamp(v, a, b) { if (a === undefined) { a = 0; b = 1; } return v < a ? a : v > b ? b : v; }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function ease(k) { return k * k * (3 - 2 * k); }

  // ---------- seeded decoration ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var decor = null;
  function buildDecor(level) {
    var rnd = mulberry32(level * 7919 + 13);
    var d = { cracks: [], eyes: [], teeth: [], drips: [], veins: [[], []] };
    for (var i = 0; i < 24; i++) {
      var ang = rnd() * Math.PI * 2;
      var rr = 0.2 + rnd() * 0.7;
      var segs = [];
      var n = 3 + Math.floor(rnd() * 4);
      var x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
      var dir = ang + (rnd() - 0.5) * 1.2;
      for (var s = 0; s < n; s++) {
        var len = 0.08 + rnd() * 0.18;
        dir += (rnd() - 0.5) * 1.4;
        x += Math.cos(dir) * len; y += Math.sin(dir) * len;
        segs.push([x, y]);
      }
      d.cracks.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr, segs: segs });
    }
    var tries = 0;
    while (d.eyes.length < 10 && tries < 200) {
      tries++;
      var a2 = rnd() * Math.PI * 2, r2 = 0.25 + rnd() * 0.62;
      var ex = Math.cos(a2) * r2, ey = Math.sin(a2) * r2 * 1.05;
      if (Math.abs(ey + 0.22) < 0.22 && Math.abs(Math.abs(ex) - 0.38) < 0.26) continue;
      if (ey > 0.05 && Math.abs(ex) < 0.75) continue;
      d.eyes.push({ x: ex, y: ey, r: 0.045 + rnd() * 0.06, phase: rnd() * 6.28 });
    }
    for (var k = 0; k < 24; k++) d.teeth.push({ h: 0.6 + rnd() * 0.8, skew: (rnd() - 0.5) * 0.5 });
    for (var m = 0; m < 6; m++) d.drips.push({ x: -0.7 + rnd() * 1.4, len: 0.15 + rnd() * 0.5, speed: 0.6 + rnd() * 1.2 });
    for (var e = 0; e < 2; e++) for (var v = 0; v < 12; v++) d.veins[e].push({ ang: rnd() * Math.PI * 2, len: 0.45 + rnd() * 0.45, w: (rnd() - 0.5) * 0.6 });
    decor = d;
  }
  buildDecor(0);

  // ---------- colors ----------
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function ramp(stops, t) {
    t = clamp(t);
    for (var i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        var a = stops[i - 1], b = stops[i];
        var k = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
        return [Math.round(lerp(a[1][0], b[1][0], k)), Math.round(lerp(a[1][1], b[1][1], k)), Math.round(lerp(a[1][2], b[1][2], k))];
      }
    }
    return stops[stops.length - 1][1];
  }
  function rgb(c, a) { return a === undefined ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')' : 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  var FACE = [[0, hex('#ffd166')], [0.35, hex('#f4e8dc')], [0.7, hex('#c9c2ba')], [1, hex('#6f756c')]];
  var BG = [[0, hex('#ffe3ea')], [0.3, hex('#3a2436')], [0.7, hex('#140508')], [1, hex('#040102')]];
  var OUTLINE = [[0, hex('#c9931e')], [0.4, hex('#6b5a52')], [1, hex('#050505')]];
  var TEETH = [[0, hex('#fbfaf5')], [1, hex('#c9b46f')]];
  var METER = [[0, hex('#ffd166')], [0.5, hex('#e07a2f')], [1, hex('#b80f0f')]];

  // ---------- face drawing ----------
  function drawEye(g, t, time, ex, ey, er, ptr, blink, small) {
    var squash = 1 - blink * 0.94;
    // sclera
    var sclera = t < 0.7 ? ramp([[0, hex('#ffffff')], [1, hex('#e8dcd6')]], t / 0.7) : ramp([[0, hex('#e8dcd6')], [1, hex('#080406')]], (t - 0.7) / 0.3);
    g.save();
    g.translate(ex, ey);
    g.scale(1, squash);
    g.beginPath(); g.arc(0, 0, er, 0, Math.PI * 2);
    g.fillStyle = rgb(sclera); g.fill();
    g.lineWidth = er * 0.12; g.strokeStyle = rgb(ramp(OUTLINE, t)); g.stroke();
    // veins
    if (t > 0.25 && !small) {
      var vn = Math.floor((t - 0.25) / 0.75 * 12);
      var arr = decor.veins[ex < 0 ? 0 : 1];
      g.lineWidth = er * 0.06;
      g.strokeStyle = 'rgba(165,22,22,' + (0.35 + 0.45 * t) + ')';
      for (var i = 0; i < vn; i++) {
        var v = arr[i];
        var sx = Math.cos(v.ang) * er, sy = Math.sin(v.ang) * er;
        var mx = sx * 0.6 + Math.cos(v.ang + 1.57) * er * v.w * 0.4, my = sy * 0.6 + Math.sin(v.ang + 1.57) * er * v.w * 0.4;
        g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(mx, my, sx * (1 - v.len), sy * (1 - v.len)); g.stroke();
      }
    }
    // pupil
    var track = 1 - clamp((t - 0.5) / 0.3);
    var px = 0, py = 0;
    if (ptr.has && track > 0) {
      var dx = ptr.x - ex, dy = ptr.y - ey;
      var dist = Math.hypot(dx, dy) || 1;
      var reach = Math.min(1, dist / (er * 6));
      px = dx / dist * er * 0.42 * reach * track;
      py = dy / dist * er * 0.42 * reach * track;
    }
    if (time < state.dartUntil) { px = state.dart.x * er * 0.5; py = state.dart.y * er * 0.5; }
    var prk = t < 0.2 ? 0.46 : t < 0.55 ? lerp(0.46, 0.16, (t - 0.2) / 0.35) : lerp(0.16, 0.72, (t - 0.55) / 0.45);
    var pr = er * prk;
    if (t > 0.3 && t < 0.75) {
      var irisA = t < 0.5 ? (t - 0.3) / 0.2 : 1 - (t - 0.5) / 0.25;
      g.beginPath(); g.arc(px, py, pr * 1.9, 0, Math.PI * 2);
      g.fillStyle = 'rgba(130,20,20,' + (irisA * 0.85) + ')'; g.fill();
    }
    var pupilCol = t < 0.7 ? [10, 8, 10] : ramp([[0, [10, 8, 10]], [1, hex('#d8d0c8')]], (t - 0.7) / 0.3);
    g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2);
    g.fillStyle = rgb(pupilCol); g.fill();
    if (t > 0.85) {
      g.beginPath(); g.arc(px, py, pr * 0.35, 0, Math.PI * 2);
      g.fillStyle = '#7a0a0a'; g.fill();
    }
    var hl = 1 - clamp(t / 0.4);
    if (hl > 0) {
      g.beginPath(); g.arc(px - pr * 0.35, py - pr * 0.4, pr * 0.28, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,' + hl + ')'; g.fill();
    }
    g.restore();
  }

  function drawFace(g, t, time, o) {
    var R = o.R;
    g.save();
    g.translate(o.cx, o.cy);
    g.rotate(o.tilt);
    var breathe = reduceMotion ? 1 : 1 + 0.012 * Math.sin(time * 2.2);
    g.scale(o.scale, o.scale * breathe);

    var ry = R * (1 + 0.16 * clamp((t - 0.5) / 0.5));
    // head
    g.beginPath(); g.ellipse(0, 0, R, ry, 0, 0, Math.PI * 2);
    g.fillStyle = o.trueFace ? '#050305' : rgb(ramp(FACE, t)); g.fill();
    g.lineWidth = R * 0.05; g.strokeStyle = rgb(ramp(OUTLINE, t)); g.stroke();
    if (t > 0.3) {
      var gr = g.createRadialGradient(0, -R * 0.15, R * 0.25, 0, 0, R * 1.15);
      gr.addColorStop(0, 'rgba(0,0,0,0)');
      gr.addColorStop(1, 'rgba(12,0,6,' + ((t - 0.3) / 0.7 * 0.8) + ')');
      g.fillStyle = gr; g.fill();
    }
    // greenish sick tint on lower half
    if (t > 0.45) {
      var sick = g.createLinearGradient(0, -ry, 0, ry);
      sick.addColorStop(0, 'rgba(60,90,60,0)');
      sick.addColorStop(1, 'rgba(60,90,60,' + ((t - 0.45) / 0.55 * 0.4) + ')');
      g.fillStyle = sick; g.fill();
    }

    // cheeks
    var blush = 1 - clamp(t / 0.3);
    if (blush > 0) {
      g.fillStyle = 'rgba(255,110,140,' + (blush * 0.55) + ')';
      g.beginPath(); g.arc(-R * 0.55, R * 0.12, R * 0.14, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(R * 0.55, R * 0.12, R * 0.14, 0, Math.PI * 2); g.fill();
    }

    // cracks
    if (t > 0.5) {
      var cn = Math.floor((t - 0.5) / 0.5 * 24);
      g.strokeStyle = 'rgba(18,4,8,0.85)'; g.lineWidth = R * 0.012; g.lineJoin = 'round';
      for (var c = 0; c < cn; c++) {
        var cr = decor.cracks[c];
        g.beginPath(); g.moveTo(cr.x * R, cr.y * ry);
        for (var s = 0; s < cr.segs.length; s++) g.lineTo(cr.segs[s][0] * R, cr.segs[s][1] * ry);
        g.stroke();
      }
    }

    // eyes geometry
    var asym = clamp((t - 0.45) / 0.4);
    var erL = R * lerp(0.16, 0.24, asym), erR = R * lerp(0.16, 0.115, asym);
    var eyL = -R * 0.22 - asym * R * 0.06, eyR = -R * 0.22 + asym * R * 0.05;
    var exL = -R * 0.38, exR = R * 0.38 + asym * R * 0.04;

    // under-eye shadows
    if (t > 0.3) {
      var ua = (t - 0.3) / 0.7 * 0.75;
      [[exL, eyL, erL], [exR, eyR, erR]].forEach(function (e) {
        var ug = g.createRadialGradient(e[0], e[1] + e[2] * 0.6, e[2] * 0.3, e[0], e[1] + e[2] * 0.6, e[2] * 1.7);
        ug.addColorStop(0, 'rgba(40,5,30,' + ua + ')'); ug.addColorStop(1, 'rgba(40,5,30,0)');
        g.fillStyle = ug; g.beginPath(); g.arc(e[0], e[1] + e[2] * 0.6, e[2] * 1.7, 0, Math.PI * 2); g.fill();
      });
    }

    // brows
    var browA = clamp((t - 0.15) / 0.35) * (1 - clamp((t - 0.75) / 0.25));
    if (browA > 0) {
      var bang = 0.55 * ease(clamp((t - 0.15) / 0.5));
      g.strokeStyle = rgb(ramp(OUTLINE, t), browA); g.lineWidth = R * 0.05; g.lineCap = 'round';
      g.beginPath(); g.moveTo(exL - erL, eyL - erL * 1.35 - Math.sin(bang) * R * 0.12); g.lineTo(exL + erL * 0.9, eyL - erL * 1.25 + Math.sin(bang) * R * 0.12); g.stroke();
      g.beginPath(); g.moveTo(exR - erR * 0.9, eyR - erR * 1.25 + Math.sin(bang) * R * 0.12); g.lineTo(exR + erR * 1.1, eyR - erR * 1.35 - Math.sin(bang) * R * 0.12); g.stroke();
    }

    // eyes
    var blink = state.blink;
    drawEye(g, t, time, exL, eyL, erL, o.ptr, blink, false);
    drawEye(g, t, time, exR, eyR, erR, o.ptr, t > 0.6 ? blink * 0.3 : blink, false);

    // extra eyes
    if (t > 0.78) {
      var en = Math.floor((t - 0.78) / 0.22 * 10);
      for (var q = 0; q < en; q++) {
        var ee = decor.eyes[q];
        var openness = reduceMotion ? 1 : 0.6 + 0.4 * Math.sin(time * 1.3 + ee.phase);
        drawEye(g, 0.95, time, ee.x * R, ee.y * ry, ee.r * R, o.ptr, 1 - openness, true);
      }
    }

    // nose
    if (t < 0.5) {
      g.strokeStyle = rgb(ramp(OUTLINE, t), 1 - t / 0.5); g.lineWidth = R * 0.035; g.lineCap = 'round';
      g.beginPath(); g.arc(0, R * 0.02, R * 0.05, 0.2, Math.PI - 0.2); g.stroke();
    } else {
      var nk = (t - 0.5) / 0.5;
      g.fillStyle = 'rgba(8,2,4,0.9)';
      g.beginPath(); g.ellipse(-R * 0.06, R * 0.05, R * 0.03 * (1 + nk), R * 0.02 * (1 + nk * 1.5), 0.3, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(R * 0.06, R * 0.05, R * 0.03 * (1 + nk), R * 0.02 * (1 + nk * 1.5), -0.3, 0, Math.PI * 2); g.fill();
    }

    // mouth
    var my = R * (0.32 + 0.14 * clamp((t - 0.7) / 0.3));
    var hw = R * (0.28 + 0.5 * t);
    var curve = R * (0.12 + 0.1 * t);
    if (t < 0.35) {
      g.strokeStyle = rgb(ramp(OUTLINE, t)); g.lineWidth = R * 0.06; g.lineCap = 'round';
